{% extends 'base.html' %}
{% block main_content %}
<div class="content container-fluid">
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title">Edit Subject</h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'app:view_subject' %}">Subjects</a></li>
          <li class="breadcrumb-item active">Edit Subject</li>
        </ul>
      </div>
    </div>
  </div>

  {% if messages %}
  <div class="col-12">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-body">
          <form method="post" action="{% url 'app:update_subject' subject.id %}">
            {% csrf_token %}
            <div class="row">
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Subject Name</label>
                  <input type="text" name="subject_name" value="{{ subject.subject_name }}" class="form-control"
                    required>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Class</label>
                  <select class="form-control" name="classe_id" required>
                    <option value="">Select Class</option>
                    {% for c in classe %}
                    <option value="{{ c.id }}" {% if subject.classe_id.id==c.id %}selected{% endif %}>{{ c.class_name }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Teacher</label>
                  <select class="form-control" name="staff_id">
                    <option value="">Select Teacher</option>
                    {% for t in staff %}
                    <option value="{{ t.id }}" {% if subject.staff.id==t.id %}selected{% endif %}>{{ t.admin.first_name
                      }} {{ t.admin.last_name }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <div class="col-12 text-right">
                <button type="submit" class="btn btn-primary">Update Subject</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
