{% extends 'base.html' %}
{% block main_content %}
<div class="content container-fluid">
    <div class="page-header">
        <div class="row align-items-center">
            <div class="col">
                <h3 class="page-title">Send Feedback</h3>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'app:parent_dashboard' %}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Feedback</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">Academic Inquiry or Message</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'app:parent_feedback' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Message to the office</label>
                            <textarea class="form-control" name="feedback" rows="6"
                                placeholder="Ask about performance, attendance, or any other school-related concerns..."
                                required></textarea>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="btn btn-primary">Submit Inquiry</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
