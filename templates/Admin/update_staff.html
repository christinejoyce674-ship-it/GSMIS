{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="row">
  <div class="col-sm-12">
    <form method="post" action="{% url 'update_subject' subject.id %}" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="page-header">
        <div class="row align-items-center">
          <div class="col">
            <h3 class="page-title">Edit Subject</h3>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="{% url 'view_subject' %}">Subject</a></li>
              <li class="breadcrumb-item active">Edit Subject</li>
            </ul>
          </div>
        </div>
      </div>

      {% include "includes/messages.html" %}

      <div class="card">
        <div class="card-body">
          <h5 class="form-title"><span>Subject Information</span></h5>
          <div class="row">

            <div class="col-12 col-sm-6">
              <label>Subject ID</label>
              <input type="text" name="subject_id" value="{{ subject.id }}" class="form-control" readonly>
            </div>

            <div class="col-12 col-sm-6">
              <label>Subject Name</label>
              <input type="text" name="subject_name" value="{{ subject.subject_name|default:'' }}" class="form-control" required>
            </div>

            <div class="col-12 col-sm-6">
              <label>Class</label>
              <select class="form-control" name="classe_id" required>
                <option value="">Select Class</option>
                {% for c in classe %}
                  <option value="{{ c.id }}" {% if subject.classe_id and subject.classe_id.id == c.id %}selected{% endif %}>{{ c.class_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Teacher</label>
              <select class="form-control" name="staff_id">
                <option value="">Select Teacher</option>
                {% for t in staff %}
                  <option value="{{ t.id }}" {% if subject.staff and subject.staff.id == t.id %}selected{% endif %}>{{ t.admin.first_name }} {{ t.admin.last_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Link</label>
              <input type="text" name="link" value="{{ subject.link|default:'' }}" class="form-control">
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-primary">Update Subject</button>
              <a href="{% url 'view_subject' %}" class="btn btn-secondary">Cancel</a>
            </div>

          </div>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
