<style>
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card h2 { color: #2980b9; margin: 0; }
    .card p { font-size: 1.2rem; font-weight: bold; }
</style>

<div class="grid-container">
    <div class="card">
        <h2>Total learners</h2>
        <p>{{ total_learners }}</p>
    </div>
    <div class="card">
        <h2>Pass Rate</h2>
        <p>{{ pass_count }} Learners</p>
    </div>
    <div class="card" style="border-left: 5px solid red;">
        <h2>Needs Attention</h2>
        <p>{{ fail_count }} Learners</p>
    </div>
</div>

<h3>Performance by Class</h3>
<table>
    {% for class in class_averages %}
    <tr>
        <td>Class {{ class.learner__class_name }}</td>
        <td>Average: {{ class.avg_score|floatformat:1 }}%</td>
    </tr>
    {% endfor %}
</table>
