{% extends 'base.html' %}
{% load static %}
{% block content %}
{% include "includes/messages.html" %}

<div class="row">
  <div class="col-sm-12">
    <form method="post" action="{% url 'update_learner' learner.id %}" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="page-header">
        <h3 class="page-title">Edit Learner</h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'view_learners' %}">Learners</a></li>
          <li class="breadcrumb-item active">Edit Learner</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="form-title">Learner Information</h5>
          <div class="row">

            <!-- User (CustomUser) fields -->
            <div class="col-12 col-sm-6">
              <label>First Name</label>
              <input type="text" name="first_name" value="{{ learner.admin.first_name }}" class="form-control" required>
            </div>
            <div class="col-12 col-sm-6">
              <label>Last Name</label>
              <input type="text" name="last_name" value="{{ learner.admin.last_name }}" class="form-control" required>
            </div>
            <div class="col-12 col-sm-6">
              <label>Learner ID</label>
              <input type="text" name="learner_id" value="{{ learner.learner_id }}" class="form-control" required>
            </div>

            <!-- Model fields -->
            <div class="col-12 col-sm-6">
              <label>Gender</label>
              <select class="form-control" name="gender" required>
                <option value="">Select Gender</option>
                <option value="F" {% if learner.gender == "F" %}selected{% endif %}>Female</option>
                <option value="M" {% if learner.gender == "M" %}selected{% endif %}>Male</option>
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Date of Birth</label>
              <input type="date" name="date_of_birth" value="{{ learner.date_of_birth }}" class="form-control">
            </div>

            <div class="col-12 col-sm-6">
              <label>Religion</label>
              <select class="form-control" name="religion" required>
                <option value="">Select Religion</option>
                <option value="C" {% if learner.religion == "C" %}selected{% endif %}>Catholic</option>
                <option value="A" {% if learner.religion == "A" %}selected{% endif %}>Anglican</option>
                <option value="M" {% if learner.religion == "M" %}selected{% endif %}>Muslim</option>
                <option value="S" {% if learner.religion == "S" %}selected{% endif %}>Seventh Day</option>
                <option value="BA" {% if learner.religion == "BA" %}selected{% endif %}>Born Again</option>
                <option value="O" {% if learner.religion == "O" %}selected{% endif %}>Other</option>
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Class</label>
              <select class="form-control" name="classe_id" required>
                <option value="">Select Class</option>
                {% for c in classe %}
                  <option value="{{ c.id }}" {% if learner.classe_id and learner.classe_id.id == c.id %}selected{% endif %}>{{ c.get_class_name_display }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Section</label>
              <select class="form-control" name="section" required>
                <option value="">Select Section</option>
                <option value="D" {% if learner.section == "D" %}selected{% endif %}>Day</option>
                <option value="B" {% if learner.section == "B" %}selected{% endif %}>Boarding</option>
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Session Year</label>
              <select class="form-control" name="session_year_id">
                <option value="">Select Session</option>
                {% for s in session_year %}
                  <option value="{{ s.id }}" {% if learner.session_year_id and learner.session_year_id.id == s.id %}selected{% endif %}>{{ s.session_start }} - {{ s.session_end }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Nationality</label>
              <input type="text" name="nationality" value="{{ learner.nationality }}" class="form-control">
            </div>

            <div class="col-12 col-sm-6">
              <label>Health Issue</label>
              <input type="text" name="health_issue" value="{{ learner.health_issue }}" class="form-control">
            </div>

            <div class="col-12 col-sm-6">
              <label>Parent</label>
              <select class="form-control" name="parent_id">
                <option value="">Select Parent</option>
                {% for p in parents %}
                  <option value="{{ p.id }}" {% if learner.parent and learner.parent.id == p.id %}selected{% endif %}>{{ p.parent_name }} ({{ p.admin.first_name }} {{ p.admin.last_name }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-sm-6">
              <label>Parent Mobile</label>
              <input type="text" name="parent_mobile_number" value="{{ learner.parent_mobile_number }}" class="form-control">
            </div>

            <div class="col-12">
              <label>Present Address</label>
              <input type="text" name="present_address" value="{{ learner.present_address }}" class="form-control">
            </div>

            <div class="col-12 mt-3">
              <label>Learner Photo</label>
              <input type="file" name="profile_pic" class="form-control">
              {% if learner.admin.profile_pic %}
                <small class="text-muted">Current: {{ learner.admin.profile_pic.url }}</small>
              {% endif %}
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-primary">Update Learner</button>
              <a href="{% url 'view_learners' %}" class="btn btn-secondary">Cancel</a>
            </div>

          </div>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
